const STORAGE_KEY = "uroquiz-progress-v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { topicStats: {}, missedIds: [], inProgressSession: null, attemptedIds: [], lastSeenAt: {} };
    const data = JSON.parse(raw);
    if (!data.topicStats) data.topicStats = {};
    if (!data.missedIds) data.missedIds = [];
    if (data.inProgressSession === undefined) data.inProgressSession = null;
    if (data.attemptedIds === undefined) {
      // Pre-existing installs (before per-question coverage tracking was added) only
      // have aggregate topicStats, not individual question ids. Approximate coverage
      // with placeholder ids so readiness doesn't wrongly drop to "0 seen" on upgrade.
      const legacyAttempted = Object.values(data.topicStats).reduce((sum, s) => sum + s.attempted, 0);
      const legacyCount = Math.min(legacyAttempted, QUESTIONS.length);
      data.attemptedIds = Array.from({ length: legacyCount }, (_, i) => `legacy-${i}`);
    }
    if (data.lastSeenAt === undefined) {
      // Pre-rotation installs have no exposure history. Default to "never seen" for
      // every question rather than guessing, so the first post-upgrade session draws
      // from the full pool (least-surprising: nothing wrongly excluded as "recent").
      data.lastSeenAt = {};
    }
    return data;
  } catch (e) {
    return { topicStats: {}, missedIds: [], inProgressSession: null, attemptedIds: [], lastSeenAt: {} };
  }
}

function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function saveInProgressSession() {
  const progress = loadProgress();
  progress.inProgressSession = {
    mode: state.mode,
    sessionQuestions: state.sessionQuestions,
    currentIndex: state.currentIndex,
    answers: state.answers
  };
  saveProgress(progress);
}

function clearInProgressSession() {
  const progress = loadProgress();
  progress.inProgressSession = null;
  saveProgress(progress);
}

const state = {
  screen: "home", // home | quiz | results | stats
  selectedTopics: [],
  mode: "study",  // study | exam
  sessionQuestions: [],
  currentIndex: 0,
  answers: [],    // { questionId, chosenIndex, correct }
};

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.screen === "home") app.appendChild(renderHome());
  else if (state.screen === "quiz") app.appendChild(renderQuiz());
  else if (state.screen === "results") app.appendChild(renderResults());
  else if (state.screen === "stats") app.appendChild(renderStats());
}

function getTopics() {
  return [...new Set(QUESTIONS.map(q => q.topic))];
}

function renderScoreDonut(correct, total) {
  const wrapper = document.createElement("div");
  wrapper.className = "donut-wrapper";
  if (total === 0) return wrapper;

  const pct = Math.round((correct / total) * 100);
  const radius = 40;
  const circumference = 2 * Math.PI * radius;
  const correctLength = (correct / total) * circumference;

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("width", "120");
  svg.setAttribute("height", "120");

  const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  bg.setAttribute("cx", "50"); bg.setAttribute("cy", "50"); bg.setAttribute("r", String(radius));
  bg.setAttribute("fill", "none");
  bg.setAttribute("stroke", "var(--incorrect)");
  bg.setAttribute("stroke-width", "16");

  const fg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  fg.setAttribute("cx", "50"); fg.setAttribute("cy", "50"); fg.setAttribute("r", String(radius));
  fg.setAttribute("fill", "none");
  fg.setAttribute("stroke", "var(--correct)");
  fg.setAttribute("stroke-width", "16");
  fg.setAttribute("stroke-dasharray", `${correctLength} ${circumference - correctLength}`);
  fg.setAttribute("stroke-dashoffset", String(circumference / 4));
  fg.setAttribute("transform", "rotate(-90 50 50)");

  const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
  label.setAttribute("x", "50"); label.setAttribute("y", "55");
  label.setAttribute("text-anchor", "middle");
  label.setAttribute("font-size", "20");
  label.setAttribute("fill", "var(--fg)");
  label.textContent = `${pct}%`;

  svg.appendChild(bg);
  svg.appendChild(fg);
  svg.appendChild(label);
  wrapper.appendChild(svg);
  return wrapper;
}

function renderHome() {
  const container = document.createElement("div");

  const title = document.createElement("h1");
  title.textContent = "UroQuiz";
  container.appendChild(title);

  const readinessProgress = loadProgress();
  const readinessAttempted = Object.values(readinessProgress.topicStats).reduce((sum, s) => sum + s.attempted, 0);
  const readinessCorrect = Object.values(readinessProgress.topicStats).reduce((sum, s) => sum + s.correct, 0);
  const readinessCard = document.createElement("div");
  readinessCard.className = "card";
  if (readinessAttempted > 0) {
    const accuracyPct = Math.round((readinessCorrect / readinessAttempted) * 100);
    const coveragePct = Math.round((readinessProgress.attemptedIds.length / QUESTIONS.length) * 100);
    const readinessPct = Math.round((accuracyPct + coveragePct) / 2);
    readinessCard.textContent = `Exam Readiness: ${readinessPct}% (${readinessCorrect}/${readinessAttempted} correct, ${readinessProgress.attemptedIds.length}/${QUESTIONS.length} questions seen)`;
  } else {
    readinessCard.textContent = "Exam Readiness: Not enough data yet";
  }
  container.appendChild(readinessCard);

  const progress = loadProgress();

  const topicCard = document.createElement("div");
  topicCard.className = "card";
  const topicTitle = document.createElement("h3");
  topicTitle.textContent = "Topics";
  topicCard.appendChild(topicTitle);

  const allTopicsRow = document.createElement("div");
  allTopicsRow.className = "topic-row";
  const allCheckbox = document.createElement("input");
  allCheckbox.type = "checkbox";
  allCheckbox.id = "topic-all";
  allCheckbox.checked = state.selectedTopics.length === 0;
  allCheckbox.addEventListener("change", () => {
    if (allCheckbox.checked) {
      state.selectedTopics = [];
      render();
    }
  });
  const allLabel = document.createElement("label");
  allLabel.htmlFor = allCheckbox.id;
  allLabel.textContent = "All Topics";
  allTopicsRow.appendChild(allCheckbox);
  allTopicsRow.appendChild(allLabel);
  topicCard.appendChild(allTopicsRow);

  getTopics().forEach(topic => {
    const row = document.createElement("div");
    row.className = "topic-row";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.id = "topic-" + topic;
    checkbox.checked = state.selectedTopics.includes(topic);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) state.selectedTopics.push(topic);
      else state.selectedTopics = state.selectedTopics.filter(t => t !== topic);
      render();
    });
    const label = document.createElement("label");
    label.htmlFor = checkbox.id;
    label.textContent = topic;
    row.appendChild(checkbox);
    row.appendChild(label);
    topicCard.appendChild(row);
  });
  container.appendChild(topicCard);

  const modeCard = document.createElement("div");
  modeCard.className = "card";
  const modeTitle = document.createElement("h3");
  modeTitle.textContent = "Mode";
  modeCard.appendChild(modeTitle);

  ["study", "exam"].forEach(mode => {
    const row = document.createElement("div");
    row.className = "topic-row";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "mode";
    radio.id = "mode-" + mode;
    radio.checked = state.mode === mode;
    radio.addEventListener("change", () => { state.mode = mode; });
    const label = document.createElement("label");
    label.htmlFor = radio.id;
    label.textContent = mode === "study" ? "Study Mode (immediate feedback)" : "Exam Mode (review at end)";
    row.appendChild(radio);
    row.appendChild(label);
    modeCard.appendChild(row);
  });
  container.appendChild(modeCard);

  const actionRow = document.createElement("div");
  if (progress.inProgressSession) {
    const resumeBtn = document.createElement("button");
    resumeBtn.textContent = "Resume Quiz";
    resumeBtn.addEventListener("click", () => {
      const session = progress.inProgressSession;
      state.mode = session.mode;
      state.sessionQuestions = session.sessionQuestions;
      state.currentIndex = session.currentIndex;
      state.answers = session.answers;
      state.screen = "quiz";
      render();
    });
    actionRow.appendChild(resumeBtn);

    const restartBtn = document.createElement("button");
    restartBtn.className = "secondary";
    restartBtn.textContent = "Restart";
    restartBtn.style.marginLeft = "0.5rem";
    restartBtn.addEventListener("click", () => {
      clearInProgressSession();
      render();
    });
    actionRow.appendChild(restartBtn);
  } else {
    const startBtn = document.createElement("button");
    startBtn.textContent = "Start Quiz";
    startBtn.addEventListener("click", startQuiz);
    actionRow.appendChild(startBtn);
  }
  container.appendChild(actionRow);

  const statsRow = document.createElement("div");
  statsRow.className = "center-row";
  const statsBtn = document.createElement("button");
  statsBtn.className = "secondary";
  statsBtn.textContent = "View Stats";
  statsBtn.addEventListener("click", () => { state.screen = "stats"; render(); });
  statsRow.appendChild(statsBtn);
  container.appendChild(statsRow);

  return container;
}

function shuffle(array) {
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleQuestionOptions(question) {
  const indices = shuffle(question.options.map((_, i) => i));
  return {
    ...question,
    options: indices.map(i => question.options[i]),
    correctIndex: indices.indexOf(question.correctIndex)
  };
}

const SESSION_SIZE = 20;

function startQuiz() {
  const topics = state.selectedTopics.length ? state.selectedTopics : getTopics();
  const pool = QUESTIONS.filter(q => topics.includes(q.topic));
  const progress = loadProgress();
  const byRecency = pool.slice().sort((a, b) => {
    const aSeen = progress.lastSeenAt[a.id] ?? -Infinity;
    const bSeen = progress.lastSeenAt[b.id] ?? -Infinity;
    return aSeen - bSeen;
  });
  const batch = byRecency.slice(0, SESSION_SIZE);
  state.sessionQuestions = shuffle(batch.map(shuffleQuestionOptions));
  state.currentIndex = 0;
  state.answers = [];
  state.screen = "quiz";
  render();
}
function renderQuiz() {
  const container = document.createElement("div");
  const q = state.sessionQuestions[state.currentIndex];

  if (!q) {
    state.screen = "results";
    render();
    return container;
  }

  const progress = document.createElement("div");
  progress.className = "progress";
  progress.textContent = `Question ${state.currentIndex + 1} of ${state.sessionQuestions.length} — ${q.subtopic}`;
  container.appendChild(progress);

  const card = document.createElement("div");
  card.className = "card";
  const questionText = document.createElement("p");
  questionText.textContent = q.question;
  card.appendChild(questionText);

  const existingAnswer = state.answers.find(a => a.questionId === q.id);
  const alreadyAnswered = !!existingAnswer;
  const isLastQuestion = state.currentIndex + 1 >= state.sessionQuestions.length;

  q.options.forEach((optionText, idx) => {
    const label = document.createElement("label");
    label.className = "option";
    label.textContent = optionText;

    if (state.mode === "study" && alreadyAnswered) {
      if (idx === q.correctIndex) label.classList.add("correct");
      else if (idx === existingAnswer.chosenIndex) label.classList.add("incorrect");
    } else if (state.mode === "exam" && alreadyAnswered && idx === existingAnswer.chosenIndex) {
      label.classList.add("selected");
    }

    label.addEventListener("click", () => {
      if (state.mode === "study" && alreadyAnswered) return;
      recordAnswer(q, idx);
      render();
    });
    card.appendChild(label);
  });

  if (state.mode === "study" && alreadyAnswered) {
    const explanation = document.createElement("p");
    explanation.className = "explanation";
    explanation.textContent = existingAnswer.correct
      ? "Correct. " + q.explanation
      : "Incorrect. " + q.explanation;
    card.appendChild(explanation);
  }

  container.appendChild(card);

  const navTopRow = document.createElement("div");
  navTopRow.className = "nav-row-split";

  if (state.currentIndex > 0) {
    const prevBtn = document.createElement("button");
    prevBtn.className = "secondary";
    prevBtn.textContent = "Previous";
    prevBtn.addEventListener("click", () => {
      state.currentIndex--;
      render();
    });
    navTopRow.appendChild(prevBtn);
  } else {
    navTopRow.appendChild(document.createElement("div"));
  }

  // Study mode requires answering before advancing (pedagogical gate, unchanged
  // from the original design); Exam mode allows free navigation at any time.
  const canAdvance = state.mode === "exam" || alreadyAnswered;
  if (canAdvance) {
    const nextBtn = document.createElement("button");
    nextBtn.textContent = isLastQuestion ? "Finish" : "Next Question";
    nextBtn.addEventListener("click", () => {
      if (isLastQuestion) {
        state.screen = "results";
      } else {
        state.currentIndex++;
      }
      render();
    });
    navTopRow.appendChild(nextBtn);
  } else {
    navTopRow.appendChild(document.createElement("div"));
  }

  container.appendChild(navTopRow);

  const homeRow = document.createElement("div");
  homeRow.className = "center-row";
  const homeBtn = document.createElement("button");
  homeBtn.className = "secondary";
  homeBtn.textContent = "Home";
  homeBtn.addEventListener("click", () => {
    saveInProgressSession();
    state.screen = "home";
    render();
  });
  homeRow.appendChild(homeBtn);
  container.appendChild(homeRow);
  return container;
}

function recordAnswer(question, chosenIndex) {
  const correct = chosenIndex === question.correctIndex;
  const existing = state.answers.find(a => a.questionId === question.id);
  if (existing) {
    existing.chosenIndex = chosenIndex;
    existing.correct = correct;
  } else {
    state.answers.push({ questionId: question.id, chosenIndex, correct });
  }
}
function saveSessionToStorage() {
  const progress = loadProgress();

  state.answers.forEach(answer => {
    const q = state.sessionQuestions.find(q => q.id === answer.questionId);
    const topic = q.topic;
    if (!progress.topicStats[topic]) progress.topicStats[topic] = { attempted: 0, correct: 0 };
    progress.topicStats[topic].attempted++;
    if (answer.correct) progress.topicStats[topic].correct++;

    const missedSet = new Set(progress.missedIds);
    if (answer.correct) missedSet.delete(answer.questionId);
    else missedSet.add(answer.questionId);
    progress.missedIds = [...missedSet];

    const attemptedSet = new Set(progress.attemptedIds);
    attemptedSet.add(answer.questionId);
    progress.attemptedIds = [...attemptedSet];

    progress.lastSeenAt[answer.questionId] = Date.now();
  });

  saveProgress(progress);
}

function renderResults() {
  const container = document.createElement("div");

  state.sessionQuestions.forEach(q => {
    if (!state.answers.some(a => a.questionId === q.id)) {
      state.answers.push({ questionId: q.id, chosenIndex: -1, correct: false });
    }
  });

  const total = state.sessionQuestions.length;
  const correctCount = state.answers.filter(a => a.correct).length;

  saveSessionToStorage();
  clearInProgressSession();

  const summary = document.createElement("div");
  summary.className = "card";
  const scoreText = document.createElement("h2");
  scoreText.textContent = `Score: ${correctCount} / ${total}`;
  summary.appendChild(scoreText);
  summary.appendChild(renderScoreDonut(correctCount, total));
  container.appendChild(summary);

  const missed = state.answers.filter(a => !a.correct);
  if (missed.length) {
    const missedTitle = document.createElement("h3");
    missedTitle.textContent = "Missed Questions";
    container.appendChild(missedTitle);

    missed.forEach(answer => {
      const q = state.sessionQuestions.find(q => q.id === answer.questionId);
      const card = document.createElement("div");
      card.className = "card";
      const qText = document.createElement("p");
      qText.textContent = q.question;
      card.appendChild(qText);
      const correctText = document.createElement("p");
      correctText.textContent = "Correct answer: " + q.options[q.correctIndex];
      card.appendChild(correctText);
      const explanation = document.createElement("p");
      explanation.className = "explanation";
      explanation.textContent = q.explanation;
      card.appendChild(explanation);
      container.appendChild(card);
    });

    const retryBtn = document.createElement("button");
    retryBtn.textContent = "Retry Missed Only";
    retryBtn.addEventListener("click", () => {
      state.sessionQuestions = shuffle(
        missed
          .map(a => state.sessionQuestions.find(q => q.id === a.questionId))
          .filter(Boolean)
          .map(shuffleQuestionOptions)
      );
      state.currentIndex = 0;
      state.answers = [];
      state.screen = "quiz";
      render();
    });
    container.appendChild(retryBtn);
  }

  const homeBtn = document.createElement("button");
  homeBtn.className = "secondary";
  homeBtn.textContent = "Back to Home";
  homeBtn.style.marginLeft = "0.5rem";
  homeBtn.addEventListener("click", () => { state.screen = "home"; render(); });
  container.appendChild(homeBtn);

  return container;
}
function renderStats() {
  const container = document.createElement("div");
  const title = document.createElement("h1");
  title.textContent = "Stats";
  container.appendChild(title);

  const progress = loadProgress();

  const topics = Object.keys(progress.topicStats);
  if (!topics.length) {
    const empty = document.createElement("p");
    empty.textContent = "No quiz attempts recorded yet.";
    container.appendChild(empty);
  } else {
    const allTimeAttempted = Object.values(progress.topicStats).reduce((sum, s) => sum + s.attempted, 0);
    const allTimeCorrect = Object.values(progress.topicStats).reduce((sum, s) => sum + s.correct, 0);
    container.appendChild(renderScoreDonut(allTimeCorrect, allTimeAttempted));

    topics.forEach(topic => {
      const s = progress.topicStats[topic];
      const card = document.createElement("div");
      card.className = "card";
      const pct = s.attempted ? Math.round((s.correct / s.attempted) * 100) : 0;
      card.textContent = `${topic}: ${s.correct}/${s.attempted} correct (${pct}%)`;
      container.appendChild(card);
    });
  }

  if (progress.missedIds.length) {
    const missedTitle = document.createElement("h3");
    missedTitle.textContent = `Missed Question Log (${progress.missedIds.length})`;
    container.appendChild(missedTitle);

    const retryBtn = document.createElement("button");
    retryBtn.textContent = "Quiz Missed Questions";
    retryBtn.addEventListener("click", () => {
      const missedQuestions = QUESTIONS.filter(q => progress.missedIds.includes(q.id));
      state.sessionQuestions = shuffle(missedQuestions.map(shuffleQuestionOptions));
      state.currentIndex = 0;
      state.answers = [];
      state.screen = "quiz";
      render();
    });
    container.appendChild(retryBtn);
  }

  const homeBtn = document.createElement("button");
  homeBtn.className = "secondary";
  homeBtn.textContent = "Back to Home";
  homeBtn.style.marginLeft = "0.5rem";
  homeBtn.addEventListener("click", () => { state.screen = "home"; render(); });
  container.appendChild(homeBtn);

  return container;
}

render();
</script>
